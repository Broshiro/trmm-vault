# Add this location block to your TacticalRMM nginx/SWAG proxy config.
# It proxies /vault-api/ to the vault-proxy service running on localhost:8200,
# keeping everything on a single HTTPS domain (no mixed-content issues).
#
# Place this BEFORE the existing "location /" block in your trmm server block.

location /vault-api/ {
    proxy_pass http://127.0.0.1:8200/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
